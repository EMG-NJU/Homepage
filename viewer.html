<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光学平台装置 · 3D 模型</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  body{margin:0;background:#FBFAF7;color:#2C2C2A;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:22px;margin:0 0 6px;font-weight:600}
  p.meta{margin:0 0 18px;color:#6B6A64;font-size:13.5px}
  .stage{background:#fff;border:1px solid #E7E4DC;border-radius:16px;overflow:hidden}
  model-viewer{width:100%;height:640px;background:#F5F3EC}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    padding:12px 14px;border-top:1px solid #E7E4DC;background:#FCFBF8}
  button{font:inherit;font-size:13.5px;padding:7px 15px;border-radius:9px;cursor:pointer;
    border:1px solid #D9D6CC;background:#fff;color:#2C2C2A}
  button:hover{background:#F1EFE8}
  button.on{background:#534AB7;border-color:#534AB7;color:#fff}
  .sep{width:1px;height:22px;background:#E7E4DC;margin:0 2px}
  .note{font-size:12.5px;color:#888780;margin-left:auto}
  @media(max-width:640px){model-viewer{height:420px}}
  .load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#6B6A64;background:#F5F3EC;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>光学平台装置 · 3D 模型</h1>
  <p class="meta">由照片经图生 3D（Normal + PBR）重建 · 鼠标拖拽旋转，滚轮缩放，右键平移</p>
  <div class="stage">
    <model-viewer id="mv" src="optical-setup-v2.glb" camera-controls="" auto-rotate="" rotation-per-second="18deg" shadow-intensity="1" exposure="1.05" environment-image="neutral" interaction-prompt="auto" alt="光学平台装置 3D 模型" ar-status="not-presenting"></model-viewer>
    <div class="bar">
      <button id="m2" class="on">V2 · 已去除多余部件</button>
      <button id="m1">V1 · 原始重建</button>
      <span class="sep"></span>
      <button id="rot" class="on">暂停自动旋转</button>
      <button id="reset">复位视角</button>
      <span class="note">单个模型约 38–42 MB，切换后需重新加载</span>
    </div>
  </div>
</div>
<script>
  const mv = document.getElementById('mv');
  const b1 = document.getElementById('m1'), b2 = document.getElementById('m2');
  const rot = document.getElementById('rot');
  function load(src, btn){
    mv.src = src; 
    b1.classList.toggle('on', btn===b1); b2.classList.toggle('on', btn===b2);
  }
  b2.onclick = () => load('optical-setup-v2.glb', b2);
  b1.onclick = () => load('optical-setup.glb', b1);
  rot.onclick = () => {
    if (mv.hasAttribute('auto-rotate')) { mv.removeAttribute('auto-rotate'); rot.textContent='开启自动旋转'; rot.classList.remove('on'); }
    else { mv.setAttribute('auto-rotate',''); rot.textContent='暂停自动旋转'; rot.classList.add('on'); }
  };
  document.getElementById('reset').onclick = () => mv.resetCamera();
</script>


</body></html>
